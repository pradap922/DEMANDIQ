<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMANDIQ Admin</title>
    <!-- Using Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #07070a;
            /* Deep dark background */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 80px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo .highlight {
            color: #ff003c;
            /* Red accent from the image */
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: #ff003c;
        }

        .main-content {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .left-section {
            flex: 1;
            max-width: 50%;
            padding-right: 40px;
        }

        .red-line {
            width: 60px;
            height: 3px;
            background-color: #ff003c;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 56px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 .highlight {
            color: #ff003c;
        }

        .subtitle {
            font-size: 16px;
            color: #999;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .contact-btn {
            background-color: #ff003c;
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
        }

        .contact-btn:hover {
            background-color: #e60036;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
        }

        .social-links {
            margin-top: 60px;
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .social-links svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            cursor: pointer;
            transition: fill 0.3s;
        }

        .social-links svg:hover {
            fill: #ff003c;
        }

        /* Analytical Interactive Chart Styles */
        .analytics-container {
            margin-top: 40px;
            width: 100%;
            max-width: 450px;
            height: 280px;
            background: linear-gradient(145deg, #111116, #0a0a0d);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 60, 0.1);
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            letter-spacing: 0.5px;
        }

        .chart-status {
            font-size: 12px;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }

        .bars-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 160px;
            gap: 12px;
            position: relative;
        }

        /* Abstract grid lines in background */
        .bars-container::before {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 40px;
            pointer-events: none;
            z-index: 0;
        }

        .bar-wrapper {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: flex-end;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }

        .bar {
            width: 100%;
            background: linear-gradient(to top, #ff003c, #ff4d79);
            border-radius: 4px 4px 0 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0);
            position: relative;
        }

        .bar-tooltip {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: #2a2a2d;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            white-space: nowrap;
        }

        .bar-tooltip::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 4px 4px 0;
            border-style: solid;
            border-color: #2a2a2d transparent transparent transparent;
        }

        .bar-wrapper:hover .bar {
            background: linear-gradient(to top, #ff3366, #ff80a0);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
            filter: brightness(1.2);
            /* Slightly raise height on hover */
            height: calc(var(--h) + 10%) !important;
        }

        .bar-wrapper:hover .bar-tooltip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            top: -40px;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(0, 255, 136, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0);
            }
        }

        /* Initial rising animation for bars */
        @keyframes growUp {
            from {
                height: 0;
                opacity: 0;
            }

            to {
                height: var(--h);
                opacity: 1;
            }
        }

        .bar {
            animation: growUp 1.2s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
            height: 0;
            /* starts at 0 for animation */
        }


        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .toggle-container span {
            margin: 0 20px;
            color: #888;
            transition: color 0.3s;
        }

        .toggle-container span.active {
            color: #fff;
        }

        .toggle-switch {
            width: 55px;
            height: 26px;
            background-color: #ff003c;
            border-radius: 26px;
            position: relative;
            cursor: pointer;
        }

        .toggle-circle {
            width: 22px;
            height: 22px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .login-box {
            background-color: #1a1a1c;
            padding: 50px 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Subtle background swirl effect for the box */
        .login-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(30, 30, 30, 0.5) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .login-box>* {
            position: relative;
            z-index: 1;
        }

        .login-box h2 {
            font-size: 26px;
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        /* SVG Icons inside input */
        .input-group .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group .icon svg {
            width: 18px;
            height: 18px;
            fill: #ff003c;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background-color: #242426;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            background-color: #2a2a2d;
            border-color: #ff003c;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
        }

        .input-group input::placeholder {
            color: #666;
            font-weight: 500;
        }

        .submit-btn {
            background-color: #ff003c;
            color: #fff;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            position: relative;

            /* Moving Animation applied solely to the button as requested */
            animation: floatingButton 3s ease-in-out infinite;
        }

        /* Moving animation keyframes */
        @keyframes floatingButton {
            0% {
                transform: translateY(0);
                box-shadow: 0 5px 15px rgba(255, 0, 60, 0.3);
            }

            50% {
                transform: translateY(-6px);
                /* Moves up */
                box-shadow: 0 15px 25px rgba(255, 0, 60, 0.5), 0 0 20px rgba(255, 0, 60, 0.2);
                /* Enhanced glow */
            }

            100% {
                transform: translateY(0);
                box-shadow: 0 5px 15px rgba(255, 0, 60, 0.3);
            }
        }

        .forgot-password {
            display: block;
            margin-top: 30px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #fff;
        }

        .error {
            color: #ff003c;
            margin-top: 15px;
            font-size: 14px;
            background: rgba(255, 0, 60, 0.1);
            padding: 10px;
            border-radius: 6px;
        }

        @media (max-width: 1024px) {
            .navbar {
                padding: 30px 40px;
            }

            .main-content {
                padding: 0 40px;
            }

            h1 {
                font-size: 46px;
            }
        }

        @media (max-width: 850px) {
            .main-content {
                flex-direction: column;
                padding: 40px;
                gap: 60px;
                text-align: center;
            }

            .left-section {
                max-width: 100%;
                padding-right: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .red-line {
                margin: 0 auto 20px auto;
            }

            .social-links {
                justify-content: center;
            }

            .nav-links {
                display: none;
                /* Hide nav on mobile for simplicity */
            }
        }
    </style>
</head>

<body>

    <div class="main-content">
        <div class="left-section">
            <div class="red-line"></div>
            <h1>Welcome to DEMANDIQ,<br>an <span class="highlight">AI Platform</span></h1>
            <p class="subtitle">Secure portal for tracking AI operations using Advanced Neural Dashboard</p>

            <!-- Interactive Analytical Component -->
            <div class="analytics-container">
                <div class="chart-header">
                    <span class="chart-title">Neural Network Traffic Activity</span>
                    <span class="chart-status"><span class="status-dot"></span> System Optimal</span>
                </div>
                <div class="bars-container">
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">28.4k</div>
                        <div class="bar" style="--h: 40%; animation-delay: 0.1s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">42.1k</div>
                        <div class="bar" style="--h: 65%; animation-delay: 0.2s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">35.8k</div>
                        <div class="bar" style="--h: 50%; animation-delay: 0.3s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">95.2k</div>
                        <div class="bar" style="--h: 90%; animation-delay: 0.4s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">68.7k</div>
                        <div class="bar" style="--h: 75%; animation-delay: 0.5s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">51.3k</div>
                        <div class="bar" style="--h: 60%; animation-delay: 0.6s;"></div>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar-tooltip">88.5k</div>
                        <div class="bar" style="--h: 85%; animation-delay: 0.7s;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="login-box">
                <h2>LOG IN</h2>

                <form method="POST">
                    <div class="input-group">
                        <span class="icon">
                            <!-- @ symbol icon -->
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10h5v-2h-5c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8v1.43c0 .79-.71 1.57-1.5 1.57s-1.5-.78-1.5-1.57V12c0-2.76-2.24-5-5-5s-5 2.24-5 5 2.24 5 5 5c1.38 0 2.64-.56 3.54-1.47.65.89 1.77 1.47 2.96 1.47 1.97 0 3.5-1.6 3.5-3.57V12c0-5.52-4.48-10-10-10zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" />
                            </svg>
                        </span>
                        <input type="email" name="username" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <span class="icon">
                            <!-- Padlock icon -->
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                            </svg>
                        </span>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="submit-btn">LOGIN</button>
                    {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
                </form>

            </div>
        </div>
    </div>
</body>

</html>
