<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>DEMANDIQ - Advanced Forecasting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="{{ url_for('static', filename='js/chart.js') }}"></script>

</head>

<body>
  <header>
    <h1>DEMANDIQ</h1>
    <p>Advanced Store & Department Sales Forecasting (Prophet / XGBoost )</p>
  </header>

  <main>
    <section class="controls">
      <div class="field">
        <label>Store ID</label>
        <input id="storeInput" placeholder="e.g. 1" />
      </div>

      <div class="field">
        <label>Dept ID</label>
        <input id="deptInput" placeholder="e.g. 1" />
      </div>

      <div class="field">
        <label>Past weeks</label>
        <input id="pastWeeks" type="number" value="52" />
      </div>

      <div class="field">
        <label>Future weeks</label>
        <input id="futureWeeks" type="number" value="12" />
      </div>

      <div class="field">
        <label>Current Stock</label>
        <input id="currentStock" type="number" value="20" />
      </div>

      <div class="field">
        <label>Safety %</label>
        <input id="safetyPercent" type="number" value="10" />
      </div>

      <div class="field">
        <label>Model</label>
        <select id="modelSelect">
          <option value="prophet">Prophet</option>
          <option value="xgb">XGBoost</option>

        </select>
      </div>

      <div class="action-buttons">
        <button id="btnRun"><i class="fas fa-play"></i> Run <span class="spinner" id="runSpinner"
            style="display:none;"><i class="fas fa-spinner fa-spin"></i></span></button>
        <button id="btnExport" style="display:none;"><i class="fas fa-download"></i> Export CSV</button>
        <!-- AI Assistant Button -->
        <button id="aiToggle" onclick="toggleAI()"><i class="fas fa-robot"></i> AI Assistance</button>
      </div>
    </section>

    

    <section class="chart-section">
      <h2>Past Weekly Sales</h2>
      <canvas id="historyChart" width="1200" height="450"></canvas>
    </section>

    <section class="chart-section">
      <h2>Forecast & Required Stock</h2>
      <canvas id="forecastChart" width="1200" height="450"></canvas>
    </section>

    <section class="table-section">
      <h2>Week-by-Week Stock Plan</h2>
      <table>
        <thead>
          <tr>
            <th>Week</th>
            <th>Date</th>
            <th>Forecast</th>
            <th>Safety</th>
            <th>Required</th>
            <th>Order Qty</th>
          </tr>
        </thead>
        <tbody id="stockTableBody"></tbody>
      </table>
      <p id="stockSummary" class="stock-summary"></p>
      <div id="riskIndicator" class="risk-box">
        Stock Status: <span id="riskText">--</span>
      </div>
    </section>
  </main>

  <footer>
    <p>Final Year Project — DEMANDIQ (Advanced Version)</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <a href="/logout" style="float:right;color:white;">Logout</a>
  <!-- ===== AI ASSISTANT ===== -->
  <div id="aiChatBox">
    <div class="ai-header">
      <span>DemandIQ AI Assistant</span>
      <button onclick="toggleAI()">✖</button>
    </div>

    <div id="aiMessages" class="ai-messages"></div>

    <div class="ai-input">
      <input id="aiInput" placeholder="Ask about forecast, stock, models..." />
      <button onclick="sendAI()">Send</button>
    </div>
  </div>
</body>

</html>
